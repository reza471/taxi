<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taxi Mock Server</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f2a20c'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' font-family='Arial' font-weight='700'%3ET%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/admin/static/style.css">
<script>
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t;
        else if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "dark"; } catch (e) {}
</script>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand"><div class="logo">T</div><div><b>Taxi Mock</b><small>test server for the meter</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="foot"></div>
  </aside>
  <div class="main">
    <header class="top">
      <h1 id="title">Dashboard</h1>
      <div class="chips" id="chips"></div>
      <button class="iconbtn" id="theme" title="Light / dark"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </header>
    <div class="view" id="view"></div>
  </div>
</div>
<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer"><header><h2 id="dtitle"></h2><button class="iconbtn" id="dclose" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header><div class="body" id="dbody"></div></aside>
<div class="toasts" id="toasts"></div>
<div class="tip" id="tip"></div>
<script src="/admin/static/app.js"></script>
</body>
</html>
