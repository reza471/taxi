# Build with:  west build --sysbuild -b esp32_devkitc/esp32/procpu zephyr-app -- \
#                  -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=\"<your private key .pem>\"
# MCUboot checks the signature of every update with the public half of this key.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
# Swap mode (with the scratch partition): the old image is kept and comes back if the
# new one is not confirmed. The default of the ESP32 board is "overwrite only" (no way back).
SB_CONFIG_MCUBOOT_MODE_SWAP_SCRATCH=y
